<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple and elegant todo list application">
    <title>Todo App - Organize Your Tasks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📝 Todo App</h1>
        
        <div class="input-container">
            <input type="text" id="todoInput" placeholder="Add a new task..." aria-label="New task input" />
            <button id="addBtn" aria-label="Add task">Add</button>
        </div>

        <ul id="todoList" role="list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
